<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📋To-Do List</h1>

    <!-- Input -->
    <div class="input-box">
        <input type="text" id="taskInput" placeholder="Enter a task...">
        <button onclick="addTask()">Add</button>
    </div>

    <!-- Filters -->
    <div class="filters">
        <button onclick="setFilter('all', event)" class="active">All</button>
        <button onclick="setFilter('active', event)">Active</button>
        <button onclick="setFilter('completed', event)">Completed</button>
    </div>

    <!-- Task list -->
    <ul id="taskList"></ul>
</div>

<!-- 🎉 Congratulations popup -->
<div id="congrats" class="congrats hidden">
    🎉 Congratulations! All tasks completed!
</div>

<script src="script.js"></script>
</body>
</html>

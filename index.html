<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pro To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>📝 My Tasks</h1>

  <div class="input-box">
    <input id="taskInput" placeholder="What needs to be done?" />
  </div>

  <ul id="taskList"></ul>

  <div class="footer">
    <span id="taskCount"></span>

    <div class="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </div>

    <button id="clearCompleted">Clear Completed</button>
  </div>

  <div id="congrats" class="hidden">
    🎉 Congratulations! You finished all tasks!
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
